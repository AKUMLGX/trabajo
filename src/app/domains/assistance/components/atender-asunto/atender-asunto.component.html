<!-- Modal de Atención de Asunto -->
<div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full" *ngIf="visible">
  <div class="relative top-20 mx-auto p-5 border w-4/5 shadow-lg rounded-md bg-white">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-2xl font-noto-sans text-gray-900">Atender Asunto {{asunto?.folio}}</h3>
      <button (click)="cerrarModal()" class="text-gray-500 hover:text-gray-700">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Información del Asunto -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <p class="text-sm text-gray-600">Persona Relacionada</p>
        <p class="font-noto-sans">{{asunto?.personaRelacionada}}</p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Carpeta de Investigación</p>
        <p class="font-noto-sans">{{asunto?.carpetaInvestigacion}}</p>
      </div>
    </div>

    <!-- Formulario -->
    <form [formGroup]="formulario" (ngSubmit)="guardarCambios()">
      <!-- Estado del Asunto -->
      <div class="mb-4">
        <label class="block text-sm font-noto-sans text-gray-700 mb-1">Estado del Asunto</label>
        <select formControlName="estado" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500">
          <option value="Pendiente">Pendiente</option>
          <option value="En Trámite">En Trámite</option>
          <option value="Parcial">Parcial</option>
          <option value="Total">Total</option>
        </select>
      </div>

      <!-- Porcentaje de Avance -->
      <div class="mb-4">
        <label class="block text-sm font-noto-sans text-gray-700 mb-1">Porcentaje de Avance</label>
        <input type="number" formControlName="porcentajeAvance" min="0" max="100"
               class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Observaciones -->
      <div class="mb-4">
        <label class="block text-sm font-noto-sans text-gray-700 mb-1">Observaciones</label>
        <textarea formControlName="observaciones" rows="4"
                  class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Adjuntar Archivos -->
      <div class="mb-6">
        <label class="block text-sm font-noto-sans text-gray-700 mb-1">Documentos Adjuntos</label>
        <div class="border-2 border-dashed border-gray-300 rounded-md p-4">
          <input type="file" multiple (change)="onFileSelected($event)"
                 class="hidden" #fileInput>
          <div class="text-center">
            <button type="button" (click)="fileInput.click()"
                    class="px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200">
              <mat-icon class="mr-1">attach_file</mat-icon>
              Seleccionar Archivos
            </button>
          </div>
          <!-- Lista de archivos seleccionados -->
          <div *ngIf="archivosSeleccionados.length > 0" class="mt-3">
            <div *ngFor="let archivo of archivosSeleccionados" class="flex items-center justify-between py-1">
              <span class="text-sm">{{archivo.name}}</span>
              <button type="button" (click)="eliminarArchivo(archivo)"
                      class="text-red-600 hover:text-red-800">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex justify-end space-x-3">
        <button type="button" (click)="cerrarModal()"
                class="px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200">
          Cancelar
        </button>
        <button type="submit" [disabled]="!formulario.valid"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
