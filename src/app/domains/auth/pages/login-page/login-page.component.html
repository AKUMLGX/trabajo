<div class="relative flex min-h-screen h-screen w-full items-center justify-center overflow-hidden bg-[#34005b]">

  <img
    src="/assets/images/tlalcalli-background.svg"
    alt=""
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 h-full w-full select-none object-contain object-center"
  />

  <div class="absolute top-1/2 left-1/2 z-10 w-full max-w-[408px] -translate-x-1/2 -translate-y-1/2 px-4">

    <div class="mx-auto w-full max-w-[376px] overflow-hidden rounded-3xl bg-[#2a0047] shadow-[0_25px_80px_rgba(0,0,0,0.45),0_0_48px_rgba(0,0,0,0.25)]">

      <div class="px-8 pb-10 pt-8 text-center sm:px-10 sm:pb-12 sm:pt-10">

        <div class="mb-8 flex justify-center">
          <img
            src="/assets/images/logo-sat-shcp-blanco.png"
            alt="SAT — Servicio de Administración Tributaria"
            class="h-11 max-w-full w-auto object-contain sm:h-12"
          />
        </div>

        <div class="mb-5 flex justify-center">
          <div class="h-[148px] w-[148px] sm:h-[160px] sm:w-[160px]">
            <img
              src="/assets/images/TLALCALLI2.svg"
              alt="Tlālcalli Logo"
              class="h-full w-full object-contain"
            />
          </div>
        </div>

        <h1 class="mb-3 font-noto-sans text-[28px] font-bold tracking-[-0.5px] text-white sm:text-[32px]">
          Tlālcalli
        </h1>

        <p class="mb-10 font-noto-sans text-base font-normal text-white/75 sm:mb-12">
          Bienvenido
        </p>

        <button
          (click)="login()"
          type="button"
          [disabled]="!puedeEntrar()"
          [title]="puedeEntrar() ? '' : 'Elige el especialista en «Entrar como»'"
          class="mx-auto flex h-[88px] w-full max-w-[344px] items-center justify-center rounded-2xl border-0 bg-[#D6AE67] px-2 py-4 font-noto-sans text-lg font-semibold normal-case tracking-normal text-[#34005B] transition-colors hover:bg-[#c9a050] disabled:cursor-not-allowed disabled:opacity-50 sm:h-[100px] sm:text-xl">
          Iniciar sesión
        </button>

      </div>
    </div>
  </div>

  @if (modoLocal) {
    <div class="absolute bottom-5 right-5 z-20 w-[220px] rounded-2xl border border-white/15 bg-white/[0.07] p-3 shadow-[0_10px_30px_rgba(0,0,0,0.25)] backdrop-blur-md"
      role="radiogroup" aria-label="Entrar como (modo local)">
      <p class="mb-2 flex items-center gap-1.5 px-1 font-noto-sans text-[10px] font-semibold uppercase tracking-[1.5px] text-white/55">
        <span class="h-1.5 w-1.5 rounded-full bg-[#d6ae67]"></span>
        Modo local · Entrar como
      </p>
      @for (r of roles; track r.id) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="rolSeleccionado() === r.id"
          [title]="r.descripcion"
          (click)="seleccionarRol(r.id)"
          class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left font-noto-sans text-xs transition"
          [class]="rolSeleccionado() === r.id ? 'bg-white/10 text-white' : 'text-white/60 hover:bg-white/5 hover:text-white/85'">
          <span class="flex h-3.5 w-3.5 shrink-0 items-center justify-center rounded-full border"
            [class]="rolSeleccionado() === r.id ? 'border-[#d6ae67]' : 'border-white/35'">
            @if (rolSeleccionado() === r.id) {
              <span class="h-1.5 w-1.5 rounded-full bg-[#d6ae67]"></span>
            }
          </span>
          {{ r.etiqueta }}
        </button>
      }
      @if (esRolEspecialista()) {
        <app-selector-especialista-local
          [seleccionado]="especialistaSeleccionado()"
          (seleccionadoChange)="seleccionarEspecialista($event)" />
      }
    </div>
  }
</div>
