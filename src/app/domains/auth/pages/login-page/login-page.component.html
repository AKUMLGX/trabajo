<!-- Login Page Premium - Tlálcalli -->
<div class="relative overflow-hidden h-screen w-screen">
  <!-- Fondo con gradiente institucional -->
  <div class="absolute inset-0 bg-gradient-to-br from-[#34005b] via-[#3e0065] to-[#5c1a7a]"></div>
  
  <!-- Patrón decorativo -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute top-0 left-0 w-full h-full" style="background-image: radial-gradient(circle at 20% 30%, rgba(214, 174, 103, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);"></div>
  </div>
  
  <!-- Círculos decorativos -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-[#d6ae67] rounded-full mix-blend-soft-light filter blur-3xl opacity-20 animate-pulse"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-[#dbb872] rounded-full mix-blend-soft-light filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 1s;"></div>
  
  <!-- Contenido principal -->
  <div class="relative z-10 flex h-full items-center justify-center p-6">
    <!-- Card de login -->
    <div class="w-full max-w-md">
      <!-- Card con efecto glassmorphism -->
      <div class="backdrop-blur-xl bg-white/10 rounded-3xl shadow-2xl border border-white/20 overflow-hidden">
        <!-- Header con logo SAT -->
        <div class="bg-white/95 px-8 py-6">
          <div class="flex justify-center">
            <img src="../../../../..{{environment.base}}/assets/images/imagotipos_hacienda_sat_color.png" alt="SAT Logo" class="h-16 w-auto" />
              </div>
            </div>
        
        <!-- Contenido del card -->
        <div class="px-10 py-10 text-center text-white">
          <!-- Logo Tlálcalli -->
          <div class="flex justify-center mb-8">
            <div class="w-32 h-32 bg-white rounded-2xl p-3 shadow-lg transform hover:scale-105 transition-transform duration-300" style="box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(214, 174, 103, 0.3);">
              <img src="../../../../..{{environment.base}}/assets/images/tlalcalli-logo.svg" alt="Tlálcalli Logo" class="w-full h-full object-contain" />
            </div>
          </div>
          
          <!-- Título -->
          <h1 class="text-5xl font-extrabold mb-3 tracking-tight" style="text-shadow: 0 4px 20px rgba(0,0,0,0.3);">
            Tlálcalli
          </h1>
          <p class="text-lg font-medium text-white/80 uppercase tracking-widest mb-12">
            Sistema de Control de Expedientes
          </p>
          
          <!-- Línea decorativa dorada -->
          <div class="flex items-center justify-center gap-4 mb-12">
            <div class="h-0.5 w-16 bg-gradient-to-r from-transparent to-[#d6ae67]"></div>
            <div class="w-3 h-3 bg-[#d6ae67] rounded-full shadow-lg" style="box-shadow: 0 0 20px rgba(214, 174, 103, 0.6);"></div>
            <div class="h-0.5 w-16 bg-gradient-to-l from-transparent to-[#d6ae67]"></div>
            </div>

          <!-- Botón de login -->
            <button
            (click)="login()"
            type="button"
            class="w-full py-4 px-8 rounded-xl font-bold text-lg uppercase tracking-wider transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]"
            style="background: linear-gradient(145deg, #d6ae67 0%, #dbb872 100%); color: #34005b; box-shadow: 0 10px 40px rgba(214, 174, 103, 0.4);"
            onmouseover="this.style.boxShadow='0 15px 50px rgba(214, 174, 103, 0.6)'"
            onmouseout="this.style.boxShadow='0 10px 40px rgba(214, 174, 103, 0.4)'"
          >
            <span class="flex items-center justify-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
              </svg>
              Iniciar Sesión
            </span>
          </button>
          </div>
        
        <!-- Footer del card -->
        <div class="bg-[#34005b]/50 px-8 py-4 border-t border-white/10">
          <p class="text-center text-white/50 text-xs font-medium tracking-wider uppercase">
            Servicio de Administración Tributaria
          </p>
        </div>
      </div>
      
      <!-- Versión -->
      <div class="mt-6 text-center">
        <p class="text-white/40 text-xs font-medium">
          © 2025 SAT - Todos los derechos reservados
        </p>
      </div>
    </div>
  </div>
</div>
