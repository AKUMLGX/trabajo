<!-- Login Page Premium - Tlálcalli -->
<div class="login-container">
  <!-- Fondo con patrón SVG -->
  <div class="background-pattern"></div>
  
  <!-- Contenido principal -->
  <div class="login-content">
    <!-- Card de login -->
    <div class="login-card">
      <!-- Header con logos institucionales -->
      <div class="card-header">
        <img 
          src="../../../../..{{environment.base}}/assets/images/imagotipos_hacienda_sat_color.png" 
          alt="Hacienda SAT" 
          class="header-logos" 
        />
      </div>
      
      <!-- Cuerpo del card -->
      <div class="card-body">
        <!-- Logo Tlálcalli -->
        <div class="logo-container">
          <div class="logo-box">
            <img 
              src="../../../../..{{environment.base}}/assets/images/tlalcalli-simbolo.svg" 
              alt="Tlálcalli Logo" 
              class="logo-image" 
            />
          </div>
        </div>
        
        <!-- Título -->
        <h1 class="app-title">Tlálcalli</h1>
        <p class="app-subtitle">SISTEMA DE CONTROL DE EXPEDIENTES</p>
        
        <!-- Línea decorativa dorada -->
        <div class="decorative-line">
          <span class="line left"></span>
          <span class="dot"></span>
          <span class="line right"></span>
        </div>

        <!-- Botón de login -->
        <button (click)="login()" type="button" class="login-button">
          <svg xmlns="http://www.w3.org/2000/svg" class="button-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
          INICIAR SESIÓN
        </button>
      </div>
      
      <!-- Footer del card -->
      <div class="card-footer">
        <p>SERVICIO DE ADMINISTRACIÓN TRIBUTARIA</p>
      </div>
    </div>
    
    <!-- Copyright -->
    <div class="copyright">
      <p>© 2025 SAT - Todos los derechos reservados</p>
    </div>
  </div>
</div>
