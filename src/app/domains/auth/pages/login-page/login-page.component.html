<div
class="relative overflow-hidden  bg-cover bg-center h-screen  w-screen  bg-no-repeat p-12 text-center    "

    class="absolute bottom-0 left-0 right-0 top-0 h-full w-full overflow-hidden bg-fixed"
    style="background-color: rgba(0, 0, 0, 0.2)">
    <div class="flex h-full items-center justify-center">
      <div class="text-verde-logo-Akamba   ">
        <div class="h-[623px] w-[434px]  block max-w-sm py-6 bg-white/20 border border-gray-200 rounded-lg shadow">

            <div class=" flex justify-center items-center ">
