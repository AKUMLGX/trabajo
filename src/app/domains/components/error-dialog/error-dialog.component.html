<div class="header">
<p mat-dialog-title align="center" class="tittle">{{ data.errorTittle }}</p>
</div>
<mat-dialog-content>
  <p>{{ data.errorDescription }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button
      mat-dialog-close
      class="modal-left-button ml-10"
      (click)="callBack()"
    >
      Aceptar
    </button>
  </mat-dialog-actions>
