<div class="flex justify-center items-center text-3xl mt-2">Visualizador</div>
<section class="py-1 bg-white">
  <div
    class="w-full lg:w-12/12 mx-auto mt-2 border-2 rounded-lg border-[#691C32]"
  >
    <div
      class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-white border-0"
    >
      <div class="flex-auto px-4 lg:px-10 py-10 rounded-lg pt-8">
        <div class="justify-left">
          <div style="justify-content: space-between; display: flex">
            <h1 class="title">Asunto1</h1>
            <button (click)="downloadMsg()" class="download">Descargar</button>
          </div>
          <h1 class="content margin">{{ subject }}</h1>
          <h1 class="title">De:</h1>
          <h1 class="content">{{ senderName + " [" + senderEmail + "]" }}</h1>
          <p class="time margin">{{ submitTime }}</p>
          <h1 class="title">Para:</h1>
          <ul>
            @for (recipient of recipients; track $index) {
            <li class="content">
              {{ recipient.name + " [" + recipient.smtpAddress + "]" }}
            </li>
            }
          </ul>
          <p class="bodyEmail">{{ body }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
