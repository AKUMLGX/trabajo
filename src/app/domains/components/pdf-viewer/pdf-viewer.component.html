@if (pdfUrl !== '') {
<div class="flex justify-center items-center text-3xl mt-2">Visualizador</div>
 <section class="py-1 bg-white">
  <div class="w-full lg:w-12/12 mx-auto mt-2 border-2 rounded-lg border-[#691C32] ">
    <div
      class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-white border-0"
    >
      <div
        class="flex-auto px-4 lg:px-10 py-10 rounded-lg pt-8"
      >
        <div class="flex justify-center items-center mt-4">
          <pdf-viewer
            [src]="pdfUrl"
            [render-text]="true"
            [original-size]="false"
            [show-all]="true"
            (error)="onErrorVisor($event)"
            style="width: 100%; height: 80vh"
          ></pdf-viewer>
        </div>
        @if (errorVisor) {
          <p class="text-center text-sm text-red-700 mt-2">
            No se pudo mostrar el PDF: {{ errorVisor }}
          </p>
        }
      </div>
    </div>
     @if(mostrarBotonCerrar){
   <div class="flex justify-center mb-4">
        <button (click)="showAgain()" class="modal-left-button mr-10" >
          Cerrar
        </button>
      </div>
     }
  </div>
</section>
} @else if (errorVisor) {
  <div class="flex justify-center items-center text-base mt-8">
    <p class="text-center text-red-700">No se pudo mostrar el PDF: {{ errorVisor }}</p>
  </div>
} @else {
  <div class="flex justify-center items-center text-xl mt-8">
    <p>Cargando PDF...</p>
  </div>
}
