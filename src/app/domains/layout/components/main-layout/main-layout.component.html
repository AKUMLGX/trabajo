<mat-toolbar class="mat-elevation-z3">
    <button mat-icon-button class="text-white" (click)="collapsed.set(!collapsed())">
        <mat-icon>menu</mat-icon>
    </button>
</mat-toolbar>
<mat-sidenav-container>
    <mat-sidenav opened mode="side" class="mat-sidenav" [style.width]="sidenavWidth()">
        <app-custom-sidenav [collapsed]="collapsed()" />
    </mat-sidenav>
    <mat-sidenav-content class="content" [style.margin-left]="sidenavWidth()">
        <!-- Allô le monde! -->
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
