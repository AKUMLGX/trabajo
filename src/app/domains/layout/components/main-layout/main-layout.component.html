<mat-toolbar class="mat-elevation-z3">
    <div class="flex">
        <button mat-icon-button class="text-white" (click)="collapsed.set(!collapsed())">
            <mat-icon>menu</mat-icon>
        </button>
        <button mat-icon-button class="text-white">
            <mat-icon>person</mat-icon>
        </button>
        <button mat-icon-button class="text-white">
            <mat-icon>pageview</mat-icon>
        </button>
    </div>
    <div class="hidden text-white lg:block">
        AKAMBA / Tablero / Lorem ipsum dolor sit amet consectetur adipisicing elit.
    </div>
    <app-navbar-content></app-navbar-content>
</mat-toolbar>
<mat-sidenav-container>
    <mat-sidenav opened mode="side" class="mat-sidenav" [style.width]="sidenavWidth()">
        <app-custom-sidenav [collapsed]="collapsed()" />
    </mat-sidenav>
    <mat-sidenav-content class="content" [style.margin-left]="sidenavWidth()">
        <!-- Allô le monde! -->
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
