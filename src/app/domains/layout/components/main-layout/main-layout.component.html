<app-load-animation></app-load-animation>
<mat-toolbar class="mat-elevation-z3">
  <div class="toolbar-left">
    <button
      mat-icon-button
      class="toolbar-btn"
      (click)="collapsed.set(!collapsed())"
      matTooltip="Menú"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <button mat-icon-button class="toolbar-btn user-btn" (click)="openModal(userInfoModal)" matTooltip="Mi Perfil">
      <mat-icon>person</mat-icon>
    </button>
    <button mat-icon-button class="toolbar-btn" [matTooltip]="'Revisión Final'" [routerLink]="'/layout/revision-final'" *ngIf="puedeVerRevisionFinal">
      <mat-icon>approval</mat-icon>
    </button>
  </div>
  <app-navbar-content-info></app-navbar-content-info>
  <app-navbar-content></app-navbar-content>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav
    opened
    mode="side"
    class="mat-sidenav"
    [style.width]="sidenavWidth()"
  >
    <app-custom-sidenav [collapsed]="collapsed()" />
  </mat-sidenav>
  <mat-sidenav-content class="content" [style.margin-left]="sidenavWidth()">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

<ng-template #userInfoModal>
  <div class="user-modal-container">
    <!-- Botón cerrar elegante -->
    <button mat-icon-button 
            class="modal-close-button" 
            (click)="closeModal()" 
            mat-dialog-close>
        <mat-icon>close</mat-icon>
      </button>
    
    <!-- Componente de perfil de usuario con toda la información -->
    <app-user-profile 
      [compact]="false" 
      [showAdvancedInfo]="true">
    </app-user-profile>
  </div>
</ng-template>
