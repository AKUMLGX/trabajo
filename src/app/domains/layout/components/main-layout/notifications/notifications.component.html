<div class="bg-[#691C32]">
    <h2 mat-dialog-title class="text-center font-montserrat text-white text-2xl">Notificaciones <mat-icon>notification_add</mat-icon> </h2>
  </div>
  <div class="text-center" >
    <mat-dialog-content  >
      <div class="flex justify-center items-center mt-2">
        <select class="bg-gray-50 border-[#691C32] text-center text-gray-900 mb-6 text-md rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-60 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"  (change)="onSelectedOption($event)">
          <option disabled selected value="">Selecciona una opción</option>
          <option value="pendientesacusar">Pendientes por acusar</option>
          <option value="validadorrespuestas">Validador de respuestas</option>
        </select>
      </div>
      @if (selecionarOpcion === 'pendientesacusar') {
        <div>
          <app-pendientes-por-acusar />
        </div>
      } @else if(selecionarOpcion === 'validadorrespuestas') {
        <div>
            <app-validador-de-respuestas />
        </div>
      }
    </mat-dialog-content>
  </div>

  @if(selecionarOpcion !== 'pendientesacusar' && selecionarOpcion !== 'validadorrespuestas' ) {
    <div class="flex justify-center items-center">
      <mat-dialog-actions>
        <button
          class="bg-wine text-white active:bg-pink-600 font-noto-sans uppercase text-sm px-6 py-3 rounded shadow hover:shadow-md outline-none focus:outline-none mr-1 ease-linear transition-all duration-150 mb-4 mt-6"
          mat-button
          mat-dialog-close
        >
          Cerrar
        </button>
      </mat-dialog-actions>
    </div>
  }
