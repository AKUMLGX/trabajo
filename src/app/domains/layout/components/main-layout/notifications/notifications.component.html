<div class="bg-rojo-Akamba/45">
    <h2 mat-dialog-title class="text-center font-montserrat">Notificaciones <mat-icon>notification_add</mat-icon> </h2>
  </div>
  <div class="text-center" >
    <mat-dialog-content  >
      <select class="bg-gray-50 border text-center border-gray-300 text-gray-900 mb-6 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"  (change)="onSelectedOption($event)">
        <option value="">Seelciona una Opcion</option>
        <option value="pendientesacusar">PendientesPorAcusar</option>
        <option value="">Validador de Respuesta</option>
      </select>
      @if (selecionarOpcion === 'pendientesacusar') {
        <div>
          Allo le monde!!! pendientes acusar
        </div>
      }
    </mat-dialog-content>
  </div>

  <div class="flex justify-center items-center">
    <mat-dialog-actions>
      <button class="modal-right-button mr-10"mat-button mat-dialog-close> cerrar</button>
    </mat-dialog-actions>
  </div>
