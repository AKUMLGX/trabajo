<div class="bg-[#D9BCA3]/30 mt-4" >
  <h2 mat-dialog-title>
    Se enviará la siguiente información:
  </h2>
  <mat-dialog-content>
    <table>
      <tr>
        <th>No.</th>
        <th>Nombre</th>
        <th>Respuesta</th>
      </tr>

@for(row of Reaply_DAta; track row.position){
  <tr>
    <td>{{row.position}}</td>
    <td>{{row.name}}  </td>
    <td>{{row.answer}}</td>
  </tr>
}
    </table>
  </mat-dialog-content>
  <div class="flex justify-center items-center">
    <mat-dialog-actions>
      <button
        class="modal-left-button mr-10"
        mat-button
        mat-dialog-close
      >
        Cancelar
      </button>
      <button
        class="modal-right-button ml-10"
      >
        Confirmar
      </button>
  </mat-dialog-actions>
  </div>
</div>
