<!-- Tabs -->
<mat-tab-group animationDuration="2000ms">
  <mat-tab>
    <ng-template mat-tab-label>
      Requerimientos
      <span class="icon-font ml-4">playlist_add_check_circle</span>
    </ng-template>
    <app-requerimientos/>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      Visualizador
      <span class="icon-font ml-4">picture_as_pdf</span>
    </ng-template>
    <app-visualizador/>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      Respuesta
      <span class="icon-font ml-4">reply_all</span>
    </ng-template>
    <app-respuesta/>
  </mat-tab>
</mat-tab-group>
