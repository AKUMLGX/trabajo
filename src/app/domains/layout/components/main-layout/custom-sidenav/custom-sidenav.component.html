<div class="sidenav-background">
    <div class="sidenav-header flex flex-col justify-center items-center">
        @if(collapsed) {
            <div class="w-12 h-12 mt-8 flex justify-center items-center bg-white rounded-lg">
                <img 
                    [width]="profilePicSize()" 
                    [height]="profilePicSize()" 
                    src="/assets/images/avatar.png" 
                />
            </div>
        } @else {
            <div class="w-32 h-32 bg-white flex justify-center items-center rounded-lg">
                <img 
                    [width]="profilePicSize()" 
                    [height]="profilePicSize()" 
                    src="/assets/images/logo-sat.png" 
                />
            </div>
        }
        <div class="header-text mt-6" [class.hide-header-text]="collapsed">
            <h1>AKAMBA</h1>
            <h1 class="mt-2">Tu espacio de administración</h1>
        </div>
    </div>
    <div class="mt-6">
        <mat-nav-list>
            @for (item of menuItems(); track item.label) {
                <a 
                    mat-list-item 
                    [routerLink]="item.route"
                    routerLinkActive
                    #rla="routerLinkActive"
                    [activated]="rla.isActive"
                    >
                    <mat-icon matListItemIcon class="text-white">{{ item.icon }}</mat-icon>
                    @if ( !collapsed ) {
                        <span matListItemTitle class="text-white">{{ item.label }}</span>
                    }
                </a>
            }   
            <a 
            mat-list-item
            (click)="logout()" 
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive"
            >
            <mat-icon matListItemIcon class="text-white">{{ "power_settings_new" }}</mat-icon>
            @if ( !collapsed ) {
                <span matListItemTitle class="text-white">{{ "Cerrar sesión" }}</span>
            }
        </a>
        </mat-nav-list>
    </div>
</div>

<!-- *ngFor="let item of menuItems()" -->
