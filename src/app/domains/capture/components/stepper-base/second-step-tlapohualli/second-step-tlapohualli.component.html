<!-- PASO 2: SEGUIMIENTO Y CONTROL -->
<div class="w-full h-full bg-gray-50 p-6">
    
    <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="max-w-7xl mx-auto space-y-6">
        
        <!-- Fechas y Seguimiento - EDITABLES -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-xl shadow-lg p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-white/20 backdrop-blur rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <h3 class="text-white font-bold text-lg">Fechas y Seguimiento</h3>
                    <p class="text-white/80 text-sm mt-1">Completa las fechas importantes</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Fecha de Vencimiento - EDITABLE -->
                <div class="bg-white/95 backdrop-blur rounded-lg p-4">
                    <app-custom-form-field
                        label="Fecha de vencimiento"
                        [required]="true"
                        type="date"
                        placeholder="Selecciona la fecha"
                        formControlName="fecha_vencimiento">
                    </app-custom-form-field>
                </div>

                <!-- Días de Retraso - EDITABLE -->
                <div class="bg-white/95 backdrop-blur rounded-lg p-4">
                    <app-custom-form-field
                        label="Días de retraso"
                        [required]="true"
                        type="number"
                        placeholder="0"
                        formControlName="dias_retraso">
                    </app-custom-form-field>
                </div>
            </div>
        </div>

        <!-- Grid de 2 Columnas - Resto de Campos -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            
            <!-- COLUMNA IZQUIERDA -->
            <div class="space-y-5">
                
                <!-- Card 1: Asignación -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Asignación</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-form-field
                            label="Responsable"
                            [required]="true"
                            placeholder="Nombre del responsable"
                            [errorMessage]="responsableError"
                            formControlName="responsable">
                        </app-custom-form-field>

                        <app-custom-form-field
                            label="Fecha de Asignación"
                            [required]="true"
                            type="date"
                            [errorMessage]="fechaAsignacionError"
                            formControlName="fecha_asignacion">
                        </app-custom-form-field>
                    </div>
                </div>

                <!-- Card 2: Sistema y WOOS -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Sistema y Seguimiento</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-form-field
                            label="Sistema / Aplicativo"
                            placeholder="Nombre del sistema (opcional)"
                            hint="Si aplica, indicar el sistema utilizado"
                            formControlName="sistema_aplicativo">
                        </app-custom-form-field>

                        <app-custom-form-field
                            label="WOOS"
                            [required]="true"
                            placeholder="REQS00002058748"
                            hint="Formato: REQS + 11 dígitos"
                            [errorMessage]="woosError"
                            formControlName="woos">
                        </app-custom-form-field>
                    </div>
                </div>

                <!-- Card 3: Oficios -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Oficios Relacionados</h3>
                    </div>
                    
                    <app-custom-form-field
                        label="Oficios Comisión / Apoyo / Designación"
                        placeholder="Números de oficios relacionados"
                        hint="Opcional - Separar con comas si son varios"
                        formControlName="oficios_comision">
                    </app-custom-form-field>
                </div>

            </div>

            <!-- COLUMNA DERECHA -->
            <div class="space-y-5">
                
                <!-- Card 4: Estado del Expediente -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Estado</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-select
                            label="Estatus"
                            [required]="true"
                            [options]="opcionesEstatus"
                            placeholder="Seleccionar estatus"
                            [errorMessage]="estatusError"
                            formControlName="estatus">
                        </app-custom-select>

                        <app-custom-select
                            label="Ubicación"
                            [required]="true"
                            [options]="opcionesUbicacion"
                            placeholder="Seleccionar ubicación"
                            [errorMessage]="ubicacionError"
                            formControlName="ubicacion">
                        </app-custom-select>
                    </div>
                </div>

                <!-- Card 5: Respuesta -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-violet-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Respuesta</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-select
                            label="Tipo de Respuesta"
                            [required]="true"
                            [options]="opcionesRespuesta"
                            placeholder="Seleccionar tipo"
                            [errorMessage]="tipoRespuestaError"
                            formControlName="tipo_respuesta">
                        </app-custom-select>

                        <app-custom-form-field
                            label="Fecha de Notificación"
                            type="date"
                            hint="Opcional - Fecha en que se notificó la respuesta"
                            formControlName="fecha_notificacion">
                        </app-custom-form-field>
                    </div>
                </div>

            </div>
        </div>

        <!-- Botón oculto para submit desde el stepper -->
        <button type="submit" class="hidden">Enviar</button>
    </form>

</div>
