<!-- PASO 2: SEGUIMIENTO Y CONTROL -->
<div class="w-full h-full bg-gray-50 p-6">
    
    <!-- Indicador de Progreso -->
    <div class="max-w-7xl mx-auto mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-[#34005b] to-[#3e0065] rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-700">Progreso del Formulario</h4>
                        <p class="text-xs text-gray-500">{{ camposCompletados }} de {{ camposTotales }} campos completados</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-2xl font-bold text-[#34005b]">{{ progresoFormulario }}%</span>
                </div>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                <div class="bg-gradient-to-r from-[#34005b] to-[#3e0065] h-3 rounded-full transition-all duration-500 ease-out" 
                     [style.width.%]="progresoFormulario"></div>
            </div>
        </div>
    </div>
    
    <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="max-w-7xl mx-auto space-y-6">
        
        <!-- Grid de 2 Columnas - Resto de Campos -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            
            <!-- COLUMNA IZQUIERDA -->
            <div class="space-y-5">
                
                <!-- Card 1: Asignación -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-gradient-to-br from-[#34005b] to-[#3e0065] rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Asignación</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-select
                            label="Responsable"
                            [required]="true"
                            [options]="opcionesResponsables"
                            placeholder="Seleccionar responsable"
                            [errorMessage]="responsableError"
                            formControlName="responsable">
                        </app-custom-select>
                    </div>
                </div>

                <!-- Card 2: Sistema / Aplicativo -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-gradient-to-br from-[#34005b] to-[#3e0065] rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Sistema y Seguimiento</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-form-field
                            label="Sistema / Aplicativo"
                            [required]="true"
                            placeholder="Selecciona o escribe un sistema"
                            [datalistOptions]="sistemasConHistorial"
                            [enableAutocomplete]="true"
                            [errorMessage]="sistemaAplicativoError"
                            formControlName="sistema_aplicativo">
                        </app-custom-form-field>
                        <p class="text-xs text-gray-500 mt-1 ml-1 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Los sistemas que uses frecuentemente aparecerán primero
                        </p>
                    </div>
                </div>

            </div>

            <!-- COLUMNA DERECHA -->
            <div class="space-y-5">
            </div>
        </div>

        <!-- Botón oculto para submit desde el stepper -->
        <button type="submit" class="hidden">Enviar</button>
    </form>

</div>
