<div class="confirmacion-modal">
  <!-- Header del Modal -->
  <div class="modal-header" [class]="'header-' + tipo">
    <div class="header-content">
      <div class="header-icon">
        <span *ngIf="tipo === 'success'" class="icon-font icon-success">check_circle</span>
        <span *ngIf="tipo === 'info'" class="icon-font icon-info">info</span>
        <span *ngIf="tipo === 'warning'" class="icon-font icon-warning">warning</span>
        <span *ngIf="tipo === 'error'" class="icon-font icon-error">error</span>
      </div>
      <div class="header-text">
        <h2 class="modal-title">{{ titulo }}</h2>
      </div>
    </div>
    <button mat-icon-button class="close-button" (click)="aceptar()" aria-label="Cerrar">
      <span class="icon-font">close</span>
    </button>
  </div>

  <!-- Contenido del Modal -->
  <div class="modal-content">
    <div class="mensaje-container">
      <p class="mensaje-principal">{{ mensaje }}</p>
      <p *ngIf="detalle" class="mensaje-detalle">{{ detalle }}</p>
    </div>
  </div>

  <!-- Footer del Modal -->
  <div class="modal-footer">
    <button
      mat-raised-button
      [class]="'btn-' + tipo"
      (click)="aceptar()"
      class="btn-aceptar">
      <span class="icon-font">check</span>
      {{ botonTexto }}
    </button>
  </div>
</div>
