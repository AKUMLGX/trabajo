<!-- OPCIÓN 1 ULTRA SIMPLIFICADA: Diseño Limpio y Eficiente -->
<div class="w-full h-full bg-gray-50 p-6">
    
    <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="max-w-7xl mx-auto">
        
        <!-- Grid de 2 Columnas -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            
            <!-- COLUMNA IZQUIERDA -->
            <div class="space-y-5">
                
                <!-- Card 1: Identificación -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Identificación</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-form-field
                            label="Expediente"
                            [required]="true"
                            placeholder="Exp.001"
                            [errorMessage]="expedienteError"
                            formControlName="expediente">
                        </app-custom-form-field>

                        <app-custom-form-field
                            label="Oficio"
                            [required]="true"
                            placeholder="199 06 02 00 00 2025-01"
                            [errorMessage]="oficioError"
                            formControlName="oficio">
                        </app-custom-form-field>

                        <app-custom-form-field
                            label="No. Entrada Central"
                            [required]="true"
                            placeholder="2025-007"
                            [errorMessage]="numeroEntradaError"
                            formControlName="numero_entrada_central">
                        </app-custom-form-field>
                    </div>
                </div>

                <!-- Card 2: Fechas -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-purple-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Fechas</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-form-field
                            label="Fecha del Documento"
                            [required]="true"
                            type="date"
                            [errorMessage]="fechaDocumentoError"
                            formControlName="fecha_documento">
                        </app-custom-form-field>

                        <app-custom-form-field
                            label="Fecha de Recepción"
                            [required]="true"
                            type="date"
                            [errorMessage]="fechaRecibidoError"
                            formControlName="fecha_recibido">
                        </app-custom-form-field>
                    </div>
                </div>

            </div>

            <!-- COLUMNA DERECHA -->
            <div class="space-y-5">
                
                <!-- Card 3: Origen y Plazo -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Origen y Plazo</h3>
                    </div>
                    
                    <div class="space-y-4">
                        <app-custom-form-field
                            label="Remitente (Área)"
                            [required]="true"
                            placeholder="AGSC, AGE/CPP, OIC"
                            [errorMessage]="remitenteError"
                            formControlName="remitente_area">
                        </app-custom-form-field>

                        <app-custom-form-field
                            label="Plazo (días)"
                            [required]="true"
                            type="number"
                            placeholder="20"
                            hint="Entre 1 y 365 días"
                            [errorMessage]="plazoError"
                            formControlName="plazo_vencimiento_prioridad">
                        </app-custom-form-field>
                    </div>
                </div>

                <!-- Card 4: Descripción -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                        <div class="w-8 h-8 bg-teal-500 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                            </svg>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800">Asunto</h3>
                    </div>
                    
                    <app-custom-textarea
                        label="Referencia / Asunto"
                        [required]="true"
                        placeholder="Descripción del asunto..."
                        [rows]="6"
                        [errorMessage]="referenciaError"
                        formControlName="referencia_asunto">
                    </app-custom-textarea>
                </div>

            </div>
        </div>

        <!-- Botón oculto para submit desde el stepper -->
        <button type="submit" class="hidden">Enviar</button>
    </form>

</div>
