<div id="container">
    <div id="button" (click)="isDropdownActive = true">
        <div style="display: flex; width: 100%; justify-content: space-between;">
            {{ selectedOption?.name  || "Lista de asuntos" }}
            @if (selectedOption) {
                <span (click)="selectedOption = undefined;
                    $event.stopImmediatePropagation()">
                    x
                </span>
            }
        </div>

        <div id="dropdown" [ngClass]="{ active: isDropdownActive }">
            <ul>
                @for (asunto of asuntos; track asunto.value) {
                    <li>
                        <a (click)="selectedOption = asunto; 
                        isDropdownActive = false;
                        $event.stopImmediatePropagation()"
                        >
                            {{ asunto.name }}
                        </a>
                    </li>
                }
            </ul>
        </div>
    </div>
</div>
