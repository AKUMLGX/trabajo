<section class=" py-1 bg-white">
    <div class="w-full lg:w-12/12 mx-auto mt-2">
        <div
            class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-white border-0">
            <div class="flex-auto px-4 lg:px-10 py-10 bg-[#D9BCA3]/30 rounded-lg pt-8">
                <form [formGroup]="civilForm" (ngSubmit)="saveCivilForm()">
                    <div class="flex flex-wrap">
                        <div class="wrapping-individual-container">
                            <label class="label-field text-blueGray-600"
                                htmlfor="grid-password">
                                    Oficio
                            </label>
                            <input 
                                type="text" placeholder="Oficio"
                                class="input-field placeholder-blueGray-300"
                                formControlName="oficio" value=""
                            >
                        </div>
                        <div class="wrapping-individual-container">
                            <label class="label-field text-blueGray-600"
                                htmlfor="grid-password">
                                    Turno jefatura
                            </label>
                            <input type="text" placeholder="Turno jefatura"
                                class="input-field placeholder-blueGray-300"
                                formControlName="turnoJefatura" value=""
                            >
                        </div>
                        <div class="wrapping-individual-container">
                            <label class="label-field text-blueGray-600"
                                htmlfor="grid-password">
                                    Folio interno
                            </label>
                            <input type="text" placeholder="Folio interno"
                                class="input-field placeholder-blueGray-300"
                                formControlName="folioInterno" value=""
                            >   
                        </div>
                        <div class="wrapping-individual-container">
                            <label class="label-field text-blueGray-600"
                                htmlfor="grid-password">
                                    Folio scanner
                            </label>
                            <input type="text" placeholder=" Folio scanner"
                                class="input-field placeholder-blueGray-300"
                                formControlName="folioScanner" value=""
                            >
                        </div>
                    </div>
                    <br>
                    <button
                        class="next-button"
                    >
                        Continuar
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
