<div class="flex flex-col">
  <div class="wrapper">
    <form id="content" 
      [formGroup]="userInputForm" 
      (ngSubmit)="saveuserInputForm()"
    >
      <input 
        id="searchId" 
        type="text" 
        name="input" 
        class="input lens" 
        [ngClass]="iptClass"
        formControlName="userInput" 
        value=""
      >
      <button 
        type="reset" 
        class="search"  
        [ngClass]="btnClass" 
        (click)="btnClickHandler()">
      </button>
    </form>
  </div>
  <button
      [disabled]="!this.userInputForm.valid"
      class="mt-4 w-28"
      [ngClass]=" !this.userInputForm.valid ? 'next-button-disabled' : 'next-button' "
    >
      Continuar
  </button>
</div>
