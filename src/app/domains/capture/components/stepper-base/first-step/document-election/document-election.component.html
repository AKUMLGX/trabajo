<div class="dropdown inline-block relative mb-[10rem] xl:mb-[16rem]">
	<button class="w-72 bg-gray-300 text-[#691C32] text-sm uppercase border-[#691C32] border-2 font-medium py-2 px-4 rounded-md inline-flex justify-center items-center">
		<div>
			{{ selectedOption?.name || "Para continuar elija que dato va a ingresar" }}
			@if(selectedOption) {
				<span
					class="text-[#691C32]"
					(click)="selectedOption = undefined;
					selectedOptionHandler()">
						X
				</span>
			}
		</div>
	</button>
	<ul class="dropdown-content absolute w-72 text-gray-800 text-sm pt-1">
		<li>
			<a class="rounded-t-md bg-white border-y-[#691C32] border-x-[#691C32] border-2 hover:bg-[#691C32] hover:text-white text-center py-2 px-4 block whitespace-nowrap"
				(click)="selectedOption = documentos[0];
				selectedOptionHandler()"
			>
				{{ documentos[0].name }}
			</a>
		</li>
      	<li>
          	<a 
		  		class="w-72 bg-white border-x-[#691C32] border-2 hover:bg-[#691C32] hover:text-white text-center py-2 px-4 block whitespace-nowrap"
                  (click)="selectedOption = documentos[1];
                  selectedOptionHandler()"				
				>
					{{ documentos[1].name }}
			</a>
      	</li>
        <li>
            <a 
                class="w-72 bg-white border-x-[#691C32] border-2 hover:bg-[#691C32] hover:text-white text-center py-2 px-4 block whitespace-nowrap"
                (click)="selectedOption = documentos[2];
                  selectedOptionHandler()"				
                >
                    {{ documentos[2].name }}
            </a>
        </li>
		<li>
			<a class="rounded-b-md bg-white border-y-[#691C32] border-x-[#691C32] border-2 hover:bg-[#691C32] hover:text-white text-center py-2 px-4 block whitespace-nowrap"
				(click)="selectedOption = documentos[3];
				selectedOptionHandler()"
			>
                {{ documentos[3].name }}
			</a>
		</li>
	</ul>
</div>
