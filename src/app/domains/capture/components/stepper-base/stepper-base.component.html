<div style="padding: 0.5em" class="text-xl">
    <mat-vertical-stepper linear [labelPosition]="'bottom'">

        <mat-step label="Búsqueda" 
                [completed]="firstStepButtonStatus" 
                [editable]="false">
            <app-first-step (firstStepButtonStatusEmitter)="buttonStatusFromFirstStepChild($event)" />
        </mat-step>

        <mat-step label="Elección de asunto" 
                [completed]="secondStepChild.isSecondStepPressed"
                [editable]="false">
            <app-second-step #secondStepChild (selectedOptionEmitter)="retrieveSelectionFromSecondStep($event)" />
        </mat-step>

        <div>
            @switch (dropdownChoice) {
                @case ('Civil') {
                  <mat-step label="Formulario Civil">
                    <div class="third-step-wrapper">
                        <app-civil-form />
                    </div>
                  </mat-step>
                }
                @case ('Penal') {
                  <span>Case 1logic and implementation</span>
                }
               @case ('Concurso mercantil') {
                  <span>Case 2logic and implementation</span>
                }
                @case ('EUACAPE') {
                    <mat-step label="Formulario EUACAPE (parte I)" 
                        [completed]="thirdStepChild.preliminarEuacapeForm.valid" 
                        [editable]="true">
                            <div class="third-step-wrapper">
                                <app-preliminar-euacape-form #thirdStepChild />
                            </div>
                    </mat-step>

                    <mat-step label="Formulario EUACAPE (parte II)">
                        <app-fourth-step />
                    </mat-step>
                     
                }
                @case ('Generalidades') {
                    <span>Case 4logic and implementation</span>
                }
                @default {
                  <span>Default case (Not 0 or 1 or 2)</span>
                }
            }
        </div>
    </mat-vertical-stepper>
</div>
