<div style="padding: 0.5em" class="text-xl">
    <mat-vertical-stepper linear [labelPosition]="'bottom'">

        <mat-step label="Búsqueda" 
                [completed]="firstStepButtonStatus" 
                [editable]="false">
            <app-first-step (firstStepButtonStatusEmitter)="buttonStatusFromFirstStepChild($event)" />
        </mat-step>

        <mat-step label="Elección de asunto" 
                [completed]="secondStepChild.isSecondStepPressed"
                [editable]="false">
            <app-second-step #secondStepChild />
        </mat-step>

        <mat-step label="Folio" 
            [completed]="thirdStepchild.preliminarEuacapeForm.valid" 
            [editable]="true">
                <div class="third-step-wrapper">
                    <app-preliminar-euacape-form #thirdStepchild />
                </div>
        </mat-step>

        <mat-step label="Llenado de formulario">
            <app-fourth-step />
        </mat-step>

    </mat-vertical-stepper>
</div>
