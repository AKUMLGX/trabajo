<div style="padding: 0.5em" class="text-xl">
    <mat-vertical-stepper [labelPosition]="'bottom'">

        <mat-step label="Elección de asunto">
            <div class="w-full h-full flex flex-col justify-center items-center bg-[#D9BCA3]/30 rounded-lg p-10">
                <h1 class="mb-8">Para continuar elija un asunto</h1>
                <app-dropdown />
            </div>
        </mat-step>

        <mat-step label="Llenado de formulario">
            <div>
                <h1>Content for step 2</h1>
            </div>
        </mat-step>

        <mat-step label="Verificación de información">
            <div>
                <h1>Content for step 3</h1>
            </div>
        </mat-step>

    </mat-vertical-stepper>
</div>
