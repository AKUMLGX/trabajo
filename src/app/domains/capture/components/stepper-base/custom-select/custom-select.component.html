<div class="tl-field">

  <label
    [for]="fieldId"
    class="tl-label transition-colors"
    [ngClass]="{
      '!text-tlalcalli-primary': isFocused && !errorMessage,
      '!text-tlalcalli-error-muted': errorMessage,
      '!text-tlalcalli-gray': disabled
    }">
    {{ label }}
    @if (required) {
      <span class="ml-0.5 text-tlalcalli-error">*</span>
    }
  </label>

  <div class="relative w-full">
    <select
      [id]="fieldId"
      [value]="value"
      [disabled]="disabled"
      (change)="onSelectChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      class="tl-input cursor-pointer appearance-none truncate !pr-10 disabled:cursor-not-allowed [&>option]:bg-white [&>option]:text-tlalcalli-dark [&>option:disabled]:text-tlalcalli-gray"
      [ngClass]="{
        '!text-tlalcalli-gray': !hasValue,
        '!border-tlalcalli-error bg-tlalcalli-error/[0.03] focus:!ring-tlalcalli-error/10': errorMessage
      }">

      <option value="">
        {{ placeholder }}
      </option>

      @for (option of options; track option) {
        <option
          [value]="option.value"
          [selected]="option.value == value"
          [disabled]="option.disabled">
          {{ option.label }}
        </option>
      }
    </select>

    <span
      class="icon-font pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 !text-[20px] transition-transform duration-200"
      [ngClass]="{
        'rotate-180 text-tlalcalli-primary': isFocused && !disabled,
        'text-tlalcalli-dark-muted': !isFocused && !disabled,
        'text-tlalcalli-gray/60': disabled
      }">expand_more</span>
  </div>

  @if (hint && !errorMessage) {
    <div class="tl-field-hint">{{ hint }}</div>
  }

  @if (errorMessage) {
    <div class="tl-field-error">
      <span class="icon-font !text-[14px]">error</span>
      {{ errorMessage }}
    </div>
  }

</div>
