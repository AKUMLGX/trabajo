<div class="w-full h-full flex flex-col justify-center items-center bg-[#D9BCA3]/30 rounded-xl border-2 border-[#691C32] p-4">
    <app-dropdown (selectionEmitter)="retrieveSelectionFromDropdown($event)" />
    <button matStepperNext
            [disabled]="!enabledButton" 
            class="mt-8"
            [ngClass]=" enabledButton ? 'next-button' : 'next-button-disabled' "
            (click)="proceedToStepTwoHandler()">
        <span>Siguiente</span>
    </button>
</div>
