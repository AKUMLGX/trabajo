<div class="w-full h-[34rem] xl:h-[30rem] flex flex-col justify-center items-center bg-[#D9BCA3]/30 rounded-xl border-2 border-[#691C32] p-4">
    <app-dropdown (selectionEmitter)="retrieveSelectionFromDropdown($event)" />
    <button 
            [disabled]="!enabledButton" 
            class="mt-8"
            [ngClass]=" enabledButton ? 'big-next-button' : 'big-next-button-disabled' "
            (click)="openCustomModalWithTemplate(templateForSecondStep)">
        <span>Siguiente</span>
    </button>
</div>

<ng-template #templateForSecondStep>
    <div class="bg-[#D9BCA3]/30">
        <h2 mat-dialog-title>Ha elegido el asunto: {{ selectedOption.name }}</h2>
        <mat-dialog-content>Proceda con el llenado del formulario</mat-dialog-content>
        <div class="flex justify-center items-center">
            <mat-dialog-actions>
                <button
                    class="modal-right-button mr-10"
                    mat-button mat-dialog-close 
                    (click)="modalCancelButton()"
                >
                    Cancelar
                </button>
                <button
                    class="modal-left-button ml-10"
                    matStepperNext 
                    mat-dialog-close 
                    mat-button 
                >
                    Continuar
                </button>
            </mat-dialog-actions>
        </div>
    </div>
</ng-template>
