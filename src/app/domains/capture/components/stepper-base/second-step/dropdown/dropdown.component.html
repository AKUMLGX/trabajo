<div class="dropdown inline-block relative mb-[22rem] md:mb-[16rem]">
	<button class="w-72 bg-gray-300 text-[#691C32] text-sm uppercase border-[#691C32] border-2 font-medium py-2 px-4 rounded-md inline-flex justify-center items-center">
		<div>
			{{ selectedOption?.name || "Para continuar elija un asunto de la lista" }}
			@if(selectedOption) {
				<span
					class="text-[#691C32]"
					(click)="selectedOption = undefined;
					selectedOptionHandler()">
						X
				</span>
			}
		</div>
	</button>
	<ul class="dropdown-content absolute w-72 text-gray-800 text-sm pt-1">
		<li>
			<a class="rounded-t-md bg-white border-y-[#691C32] border-x-[#691C32] border-2 hover:bg-[#691C32] hover:text-white text-center py-2 px-4 block whitespace-nowrap"
				(click)="selectedOption = asuntos[0];
				selectedOptionHandler()"
			>
				EUACAPES
			</a>
		</li>
      	<li class="dropdown">
          	<a 
		  		class="w-72 bg-white rounded-b-md border-x-[#691C32] border-b-[#691C32] border-2 hover:bg-[#691C32] hover:text-white text-center py-2 px-4 block whitespace-nowrap"
				(click)="selectedOption = undefined; showSubmenuHandler()"				
				>
					GENERALIDADES
			</a>
		  	@if(isSubmenuDeployed){
				<ul class="dropdown-content text-xs lg:w-[13rem] lg:absolute lg:text-gray-700 lg:pl-5 lg:ml-64 lg:-mt-10">
					<li>
						<a class="lg:rounded-t-md border-y-[#691C32] border-x-[#691C32] border-2 bg-white text-center lg:text-xs hover:bg-[#691C32] hover:text-white py-2 px-4 block whitespace-nowrap"
							(click)="selectedOption = asuntos[2];
							selectedOptionHandler()"
						>
							PENAL
						</a>
					<li>
						<a class=" border-x-[#691C32] border-2 bg-white hover:bg-[#691C32] hover:text-white text-center lg:text-xs py-2 px-4 block whitespace-nowrap"
							(click)="selectedOption = asuntos[3];
							selectedOptionHandler()"
						>
							CIVIL
						</a>
					<li>
						<a class="border-y-[#691C32] border-x-[#691C32] border-2 bg-white hover:bg-[#691C32] hover:text-white text-center lg:text-xs py-2 px-4 block whitespace-nowrap"
							(click)="selectedOption = asuntos[4];
							selectedOptionHandler()"
						>
							LABORAL
						</a>
					<li>
						<a class=" border-x-[#691C32] border-2 bg-white hover:bg-[#691C32] hover:text-white text-center lg:text-xs py-2 px-4 block whitespace-nowrap"
							(click)="selectedOption = asuntos[5];
							selectedOptionHandler()"
						>
							JUICIO DE AMPARO
						</a>
					<li>
						<a class="border-y-[#691C32] border-x-[#691C32] border-2 bg-white hover:bg-[#691C32] hover:text-white text-center lg:text-xs py-2 px-4 block whitespace-nowrap"
							(click)="selectedOption = asuntos[6];
							selectedOptionHandler()"
						>
							CONCURSO MERCANTIL
						</a>
					<li>
						<a class="lg:rounded-b-md lg:border-b-[#691C32] border-x-[#691C32] border-2 bg-white hover:bg-[#691C32] hover:text-white text-center:text-xs py-2 px-4 block whitespace-nowrap"
							(click)="selectedOption = asuntos[7];
							selectedOptionHandler()"
						>
							COPIA DE CONOCIMIENTO
						</a>
				</ul>
			}
      	</li>
