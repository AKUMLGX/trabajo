<div class="h-full w-full bg-tlalcalli-light-lavender p-6">
  <div class="mx-auto mb-6 max-w-7xl">
    <div
      class="rounded-xl border border-tlalcalli-light-muted bg-white p-4 shadow-sm"
    >
      <div class="mb-2 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-tlalcalli-primary text-white"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </div>

          <div>
            <h4 class="text-sm font-semibold text-tlalcalli-dark">
              Progreso del formulario
            </h4>

            <p class="text-xs font-noto-sans">
              {{ camposCompletados }} de {{ camposTotales }} campos completados
            </p>
          </div>
        </div>

        <span class="text-2xl font-noto-sans text-tlalcalli-primary">
          {{ progresoFormulario }}%
        </span>
      </div>

      <div
        class="h-3 w-full overflow-hidden rounded-full bg-tlalcalli-light-base"
      >
        <div
          class="h-full rounded-full bg-tlalcalli-primary transition-all duration-500"
          [style.width.%]="progresoFormulario"
        ></div>
      </div>
    </div>
  </div>

  <form
    [formGroup]="formulario"
    (ngSubmit)="onSubmit()"
    class="mx-auto max-w-7xl space-y-6"
  >
    <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
      <div class="space-y-5">
        <div
          class="rounded-xl border border-tlalcalli-light-muted bg-white p-6 shadow-sm"
        >
          <div
            class="mb-4 flex items-center gap-3 border-b border-tlalcalli-light-base pb-3"
          >
            <div
              class="flex h-9 w-9 items-center justify-center rounded-lg bg-tlalcalli-primary text-white"
            >
              <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
            </div>

            <h3 class="text-base font-semibold text-tlalcalli-dark">
              Asignación
            </h3>
          </div>

          <div class="flex flex-col gap-3 xl:flex-row xl:items-end">
            <div class="min-w-0 flex-1">
              <app-custom-select
                label="Responsable"
                [required]="true"
                [options]="opcionesResponsables"
                placeholder="Seleccionar responsable"
                [errorMessage]="responsableError"
                formControlName="responsable"
              >
              </app-custom-select>
            </div>

            <div class="flex flex-wrap gap-3">
              <button
                type="button"
                (click)="agregarResponsable()"
                class="rounded-lg bg-tlalcalli-primary px-4 py-2.5 text-sm font-noto-sans text-white transition hover:opacity-90"
              >
                Agregar
              </button>

              @if (formulario.get('responsable')?.value) {
                <button
                  type="button"
                  (click)="editarResponsableSeleccionado()"
                  class="rounded-lg bg-tlalcalli-lavender px-4 py-2.5 text-sm font-noto-sans text-white transition hover:opacity-90"
                >
                  Editar
                </button>

                <button
                  type="button"
                  (click)="eliminarResponsableSeleccionado()"
                  class="rounded-lg border border-red-500 px-4 py-2.5 text-sm font-noto-sans text-red-600 transition hover:bg-red-50"
                >
                  Eliminar
                </button>
              }
            </div>
          </div>
        </div>
      </div>
    </div>

    <button type="submit" class="hidden">
      Enviar
    </button>
  </form>
</div>

<app-custom-modal2
  [visible]="modalResponsableVisible && modalResponsableTipo === 'crear'"
  type="input"
  inputPlaceholder="Escribe el nombre del responsable a agregar"
  confirmText="Aceptar"
  cancelText="Cancelar"
  (cancelClick)="cerrarModalResponsable()"
  (confirm)="confirmarModalResponsable($event)"
>
</app-custom-modal2>

<app-custom-modal2
  [visible]="modalResponsableVisible && modalResponsableTipo === 'editar'"
  type="input"
  inputPlaceholder="Escribe el nuevo nombre del responsable"
  [inputValue]="responsableModalSeleccionado?.nombre || ''"
  confirmText="Aceptar"
  cancelText="Cancelar"
  (cancelClick)="cerrarModalResponsable()"
  (confirm)="confirmarModalResponsable($event)"
>
</app-custom-modal2>

<app-custom-modal2
  [visible]="modalResponsableVisible && modalResponsableTipo === 'eliminar'"
  type="confirm"
  [title]="
    '¿Deseas eliminar “' +
    (responsableModalSeleccionado?.nombre || '') +
    '”?'
  "
  confirmText="Aceptar"
  cancelText="Cancelar"
  (cancelClick)="cerrarModalResponsable()"
  (confirm)="confirmarModalResponsable()"
>
</app-custom-modal2>
