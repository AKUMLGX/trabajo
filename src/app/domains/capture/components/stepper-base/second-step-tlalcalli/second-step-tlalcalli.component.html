<div class="h-full w-full bg-tlalcalli-light-lavender p-6">
  <div class="mx-auto mb-6 max-w-7xl">
    <div class="rounded-xl border border-tlalcalli-light-muted bg-white p-4 shadow-sm">
      <div class="mb-2 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-tlalcalli-primary text-white">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z">
              </path>
            </svg>
          </div>

          <div>
            <h4 class="text-sm font-semibold text-tlalcalli-dark">
              Progreso del formulario
            </h4>
            <p class="text-xs text-tlalcalli-gray">
              {{ camposCompletados }} de {{ camposTotales }} campos completados
            </p>
          </div>
        </div>

        <span class="text-2xl font-bold text-tlalcalli-primary">
          {{ progresoFormulario }}%
        </span>
      </div>

      <div class="h-3 w-full overflow-hidden rounded-full bg-tlalcalli-light-base">
        <div
          class="h-full rounded-full bg-tlalcalli-primary transition-all duration-500"
          [style.width.%]="progresoFormulario">
        </div>
      </div>
    </div>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="mx-auto max-w-7xl space-y-6">
    <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
      <div class="space-y-5">
        <div class="rounded-xl border border-tlalcalli-light-muted bg-white p-6 shadow-sm">
          <div class="mb-4 flex items-center gap-3 border-b border-tlalcalli-light-base pb-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-tlalcalli-primary text-white">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                </path>
              </svg>
            </div>

            <h3 class="text-base font-semibold text-tlalcalli-dark">
              Asignación
            </h3>
          </div>

          <app-custom-select
            label="Responsable"
            [required]="true"
            [options]="opcionesResponsables"
            placeholder="Seleccionar responsable"
            [errorMessage]="responsableError"
            formControlName="responsable">
          </app-custom-select>
        </div>
      </div>
    </div>

    <button type="submit" class="hidden">Enviar</button>
  </form>
</div>
