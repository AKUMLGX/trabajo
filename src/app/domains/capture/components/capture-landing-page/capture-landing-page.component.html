<div class="h-full w-full flex flex-col justify-around items-center bg-[#D9BCA3]/30">
    <div class="mt-10">
        <div class="w-60 h-60 bg-white rounded-full flex justify-center items-center">
            <img
            src="assets/images/capture_init.png"
            alt="Imagen de inicio de captura"
            width="150"
        />
        </div>
    </div>
    <div class="flex flex-col justify-center items-center">
        <div class="mb-4 text-[#2F722F] text-2xl">
            ¡Bienvenido a la bandeja de captura!
        </div>
        <div class="mb-4 text-[#2F722F] text-2xl">
            Antes de continuar asegúrate de tener a la mano los siguientes documentos: 
        </div>
        <div class="mb-4 text-[#2F722F] text-2xl">
            Documento A, Documento B & Documento C
        </div>
        <div>
            <button class="button" style="vertical-align:middle" (click)="startStepperHandler()">
                <span>Iniciar captura </span>
            </button>
        </div>
    </div>
</div>
