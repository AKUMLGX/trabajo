<section class="tl-card p-5 md:p-6">
  <div class="tl-section-title mb-5">
    <span class="tl-section-icon"><span class="icon-font !text-[22px]">search</span></span>
    <div>
      <h2 class="tl-section-heading">Buscar expediente</h2>
      <p class="tl-section-subtitle">Expediente y oficio filtran al escribir. Prioridad, estatus y responsable se aplican al elegirlos.</p>
    </div>
  </div>

  <form [formGroup]="consultForm" (ngSubmit)="onSave()">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <div>
        <label for="expediente" class="tl-label">Expediente</label>
        <input id="expediente" type="text" placeholder="EXP-2509-0001" formControlName="expediente" autocomplete="off" class="tl-input" />
      </div>

      <div>
        <label for="oficio" class="tl-label">Oficio</label>
        <input id="oficio" type="text" placeholder="Número de oficio" formControlName="oficio" autocomplete="off" class="tl-input" />
      </div>

      <div>
        <label for="prioridad" class="tl-label">Prioridad</label>
        <select id="prioridad" formControlName="prioridad" class="tl-select">
          <option [ngValue]="''">Todas</option>
          @for (opcion of opcionesPrioridad; track opcion.value) {
            <option [ngValue]="opcion.value">{{ opcion.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="status" class="tl-label">Estatus</label>
        <select id="status" formControlName="status" class="tl-select">
          <option [ngValue]="''">Todos</option>
          @for (opcion of opcionesEstatus; track opcion.value) {
            <option [ngValue]="opcion.value">{{ opcion.label }}</option>
          }
        </select>
      </div>

      <div>
        <label for="responsable" class="tl-label">Responsable</label>
        <select id="responsable" formControlName="responsable" class="tl-select">
          <option [ngValue]="''">Todos</option>
          @for (opcion of opcionesResponsables; track opcion.value) {
            <option [ngValue]="opcion.value">{{ opcion.label }}</option>
          }
        </select>
      </div>

      <div class="flex items-end justify-end gap-3">
        <button type="button" class="tl-btn-secondary" (click)="limpiarFiltros()">Limpiar</button>
        <button type="submit" class="tl-btn-primary">
          <span class="icon-font !text-[18px]">search</span>
          Buscar
        </button>
      </div>
    </div>
  </form>
</section>
