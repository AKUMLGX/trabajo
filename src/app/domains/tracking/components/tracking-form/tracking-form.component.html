<section class="py-1 bg-blueGray-50">
  <div class="w-full lg:w-12/12 mx-auto mt-2">
    <div class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-blueGray-100 border-0">
      <div class="rounded-t bg-white mb-0 px-6 py-6"></div>
      <div class="flex-auto px-4 lg:px-10 py-10 pt-0">
        <form [formGroup]="consultForm" (ngSubmit)="onSave()">
          <div class="flex flex-wrap">
            <div class="w-full lg:w-6/12 px-4" (mouseenter)="DetectInput(true, 'folioInterno')"
              (mouseleave)="DetectInput(false, 'folioInterno')">
              <div class="relative w-full mb-3">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2" htmlfor="grid-password">
                  Folio interno
                  <span title="Clave interna asignada al asunto para su seguimiento interno."><mat-icon
                      class="icon-display">help_outline</mat-icon></span>
                </label>
                <input type="text" placeholder="Folio interno"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  formControlName="folioInterno" value="" [(ngModel)]="campoValor['folioInterno']"
                  (ngModelChange)="getValueInput()" #InputFormulario />
                <mat-list *ngIf="showCoincidencias['folioInterno'] && coincidencias.length > 0"
                  class="border-1 px-5 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  [@fadeInOut]>
                  <mat-list-item *ngFor="let coincidencia of coincidencias; let i = index"
                    (click)="selectCoincidencia(coincidencia)" class="hover-item" [@fadeInOut]>
                    {{ coincidencia }}
                    <hr style="background-color: #783246;  padding: 1px 0;" />
                  </mat-list-item>
                </mat-list>


              </div>
            </div>
            <div class="w-full lg:w-6/12 px-4">
              <div class="relative w-full mb-3" (mouseenter)="DetectInput(true, 'carpetaInvertigacion')"
                (mouseleave)="DetectInput(false, 'carpetaInvertigacion')">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2" htmlfor="grid-password">
                  Carpeta de investigación
                  <span title="Número de la carpeta de investigación asociada al asunto. "><mat-icon
                      class="icon-display">help_outline</mat-icon></span>
                </label>
                <input type="text" placeholder="Carpeta de investigación"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  formControlName="carpetaInvertigacion" value="" [(ngModel)]="campoValor['carpetaInvertigacion']"
                  (ngModelChange)="getValueInput()" #InputFormulario />

                <mat-list *ngIf="showCoincidencias['carpetaInvertigacion']  && coincidencias.length > 0"
                  class="border-1 px-5 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  [@fadeInOut]>
                  <mat-list-item *ngFor="let coincidencia of coincidencias; let i = index"
                    (click)="selectCoincidencia(coincidencia)" class="hover-item" [@fadeInOut]>
                    {{ coincidencia }}
                    <hr style="background-color: #783246;  padding: 1px 0;" />
                  </mat-list-item>
                </mat-list>


              </div>
            </div>
            <div class="w-full lg:w-6/12 px-4">
              <div class="relative w-full mb-3" (mouseenter)="DetectInput(true, 'oficio')"
                (mouseleave)="DetectInput(false, 'oficio')">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2" htmlfor="grid-password">
                  Oficio
                  <span title="Número de oficio asignado al documento."><mat-icon
                      class="icon-display">help_outline</mat-icon></span>
                </label>
                <input type="text" placeholder="Oficio"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  formControlName="oficio" value="" [(ngModel)]="campoValor['oficio']" (ngModelChange)="getValueInput()"
                  #InputFormulario />
                <mat-list *ngIf="showCoincidencias['oficio'] && coincidencias.length > 0"
                  class="border-1 px-5 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  [@fadeInOut]>
                  <mat-list-item *ngFor="let coincidencia of coincidencias; let i = index"
                    (click)="selectCoincidencia(coincidencia)" class="hover-item" [@fadeInOut]>
                    {{ coincidencia }}
                    <hr style="background-color: #783246;  padding: 1px 0;" />
                  </mat-list-item>
                </mat-list>


              </div>
            </div>
            <div class="w-full lg:w-6/12 px-4">
              <div class="relative w-full mb-3" (mouseenter)="DetectInput(true, 'autoridadRemitente')"
                (mouseleave)="DetectInput(false, 'autoridadRemitente')">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2" htmlfor="grid-password">
                  Autoridad remitente
                  <span title="Autoridad que remite el asunto o documento."><mat-icon
                      class="icon-display">help_outline</mat-icon></span>
                </label>
                <input type="text" placeholder="Autoridad remitente"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  formControlName="autoridadRemitente" value="" [(ngModel)]="campoValor['autoridadRemitente']"
                  (ngModelChange)="getValueInput()" #InputFormulario />
                <mat-list *ngIf="showCoincidencias['autoridadRemitente'] && coincidencias.length > 0"
                  class="border-1 px-5 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  [@fadeInOut]>
                  <mat-list-item *ngFor="let coincidencia of coincidencias; let i = index"
                    (click)="selectCoincidencia(coincidencia)" class="hover-item" [@fadeInOut]>
                    {{ coincidencia }}
                    <hr style="background-color: #783246;  padding: 1px 0;" />
                  </mat-list-item>
                </mat-list>


              </div>
            </div>
            <div class="w-full lg:w-6/12 px-4">
              <div class="relative w-full mb-3" (mouseenter)="DetectInput(true, 'personaRelacionada')"
                (mouseleave)="DetectInput(false, 'personaRelacionada')">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2" htmlfor="grid-password">
                  Persona relacionada
                  <span title="Nombre de la persona vinculada al asunto."><mat-icon
                      class="icon-display">help_outline</mat-icon></span>
                </label>
                <input type="text" placeholder="Persona relacionada"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  formControlName="personaRelacionada" value="" [(ngModel)]="campoValor['personaRelacionada']"
                  (ngModelChange)="getValueInput()" #InputFormulario />
                <mat-list *ngIf="showCoincidencias['personaRelacionada'] && coincidencias.length > 0"
                  class="border-1 px-5 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  [@fadeInOut]>
                  <mat-list-item *ngFor="let coincidencia of coincidencias; let i = index"
                    (click)="selectCoincidencia(coincidencia)" class="hover-item" [@fadeInOut]>
                    {{ coincidencia }}
                    <hr style="background-color: #783246;  padding: 1px 0;" />
                  </mat-list-item>
                </mat-list>


              </div>
            </div>
            <div class="w-full lg:w-6/12 px-4">
              <div class="relative w-full mb-3" (mouseenter)="DetectInput(true, 'volante_jefatura')"
                (mouseleave)="DetectInput(false, 'volante_jefatura')">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2" htmlfor="grid-password">
                  Volante Jefatura
                  <span title="Volante"><mat-icon class="icon-display">help_outline</mat-icon></span>
                </label>
                <input type="text" placeholder="Volante Jefatura"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  formControlName="volante_jefatura" value="" [(ngModel)]="campoValor['volante_jefatura']"
                  (ngModelChange)="getValueInput()" #InputFormulario />
                <mat-list *ngIf="showCoincidencias['volante_jefatura']  && coincidencias.length > 0"
                  class="border-1 px-5 py-3 placeholder-blueGray-300 text-wine bg-white rounded text-sm shadow focus:outline-none focus:ring ring-wine w-full ease-linear transition-all duration-150"
                  [@fadeInOut]>
                  <mat-list-item *ngFor="let coincidencia of coincidencias; let i = index"
                    (click)="selectCoincidencia(coincidencia)" class="hover-item" [@fadeInOut]>
                    {{ coincidencia }}
                    <hr style="background-color: #783246;  padding: 1px 0;" />
                  </mat-list-item>
                </mat-list>
              </div>
            </div>
          </div>
          <br />
          <div class="flex flex-col md:flex-row md:justify-between"> <button
              class="h-9 mt-2 mb-4 md:mb-0 bg-wine text-white active:bg-pink-600 font-bold uppercase text-xs px-4 py-2 rounded shadow hover:shadow-md outline-none focus:outline-none mr-1 ease-linear transition-all duration-150"
              type="submit">
              Buscar
            </button>
            <div>
              <div class="flex flex-row justify-between">
                <div>
                  <p>Formato</p>
                  <div style="border: 2px solid #691C32;" class="mb-4">
                    <select id="formato" [formControl]="formato"
                      style="background-color: transparent; width: 100%; height: 30px;">
                      <option value="pdf">pdf</option>
                      <option value="csv">csv</option>
                      <option value="xlsx">xlsx</option>
                    </select>
                  </div>
                </div>
                <div>
                  <p>Administración</p>
                  <div style="border: 2px solid #691C32;" class="mb-4">
                    <select id="administracion" [formControl]="administracion"
                      style="background-color: transparent; width: 100%; height: 30px;">
                      <option [ngValue]="null" disabled>Elija una administración</option>
                      <option value=" ">&nbsp;</option>
                      <option value="a_1">Administración 1</option>
                      <option value="a_2">Administración 2</option>
                      <option value="a_3">Administración 3</option>
                      <option value="a_4">Administración 4</option>
                      <option value="a_5">Administración 5</option>
                    </select>
                  </div>
                </div>

              </div>
              <div>
                <input type="date" [max]="getToday()" class="mr-10 date mb-4 md:mb-0" value="2024-11-11" [formControl]="fecha" required />
                <button type="button" (click)="descargarAcuse()"
                  class="bg-verde-Akamba text-white active:bg-pink-600 font-bold uppercase text-xs px-4 py-2 rounded shadow hover:shadow-md outline-none focus:outline-none mr-1 ease-linear transition-all duration-150">
                  Descargar acuse
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
