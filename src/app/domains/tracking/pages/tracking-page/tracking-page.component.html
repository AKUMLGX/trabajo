<!-- =====================================================
     BANDEJA DE SEGUIMIENTO - Header Premium
     Paleta Institucional SAT
     ===================================================== -->

<!-- Header mejorado con diseño institucional -->
<div class="rounded-2xl shadow-xl mx-4 mt-4 mb-6 overflow-hidden relative"
     style="background: linear-gradient(145deg, #34005b 0%, #3e0065 40%, #5c1a7a 100%);">
  <!-- Patrón decorativo -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute inset-0" style="background-image: radial-gradient(circle at 20% 30%, rgba(214, 174, 103, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);"></div>
  </div>

  <!-- Línea dorada superior -->
  <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-[#d6ae67] to-transparent"></div>

  <div class="px-8 py-7 relative z-10">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-5">
        <!-- Icono con efecto premium -->
        <div class="backdrop-blur-sm rounded-2xl p-4 relative overflow-hidden"
             style="background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);">
          <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent opacity-0 hover:opacity-100 transition-opacity duration-300"></div>
          <svg class="w-9 h-9 text-white relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
        </div>

        <!-- Texto del header -->
        <div>
          <h1 class="text-3xl font-noto-sans text-white tracking-tight" style="text-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);">
            Bandeja de Seguimiento
          </h1>
          <p class="text-white/75 text-sm mt-2 font-noto-sans">
            Gestión y control de expedientes asignados
          </p>
        </div>
      </div>

      <!-- Badge decorativo -->
      <div class="hidden md:flex items-center gap-3 px-5 py-3 rounded-xl"
           style="background: rgba(214, 174, 103, 0.2); border: 1px solid rgba(214, 174, 103, 0.3);">
        <div class="w-3 h-3 rounded-full bg-[#d6ae67] animate-pulse" style="box-shadow: 0 0 10px rgba(214, 174, 103, 0.6);"></div>
        <span class="text-white/90 text-sm font-semibold">Sistema Activo</span>
      </div>
    </div>
  </div>

  <!-- Línea dorada inferior -->
  <div class="absolute bottom-0 left-0 right-0 h-0.5 bg-gradient-to-r from-transparent via-[#d6ae67]/60 to-transparent"></div>
</div>

<app-tracking-form></app-tracking-form>
<app-tracking-table></app-tracking-table>
<router-outlet />
