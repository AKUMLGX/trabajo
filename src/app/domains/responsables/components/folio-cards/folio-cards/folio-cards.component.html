<div class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4">
  <article
    *ngFor="let folio of folios"
    class="relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-lg">

    <div class="mb-5 flex items-start justify-between gap-4">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[#4B006E]/10 text-[#4B006E]">
        <span class="icon-font">{{ folio.icono || 'confirmation_number' }}</span>
      </div>

      <span class="rounded-full bg-[#4B006E]/10 px-3 py-1 text-xs font-black text-[#4B006E]">
        {{ folio.acronimo }}
      </span>
    </div>

    <h3 class="m-0 line-clamp-2 text-base font-black text-gray-700">
      {{ folio.titulo }}
    </h3>

    <p
      *ngIf="folio.descripcion"
      class="mt-2 line-clamp-2 text-sm font-noto-sans text-gray-400">
      {{ folio.descripcion }}
    </p>

    <div class="mt-6">
      <span class="block text-xs font-black uppercase tracking-wide text-gray-400">
        Total generado
      </span>

      <span class="mt-1 block text-4xl font-black text-[#4B006E]">
        {{ folio.total }}
      </span>
    </div>

    <div class="mt-5 rounded-xl bg-gray-50 px-4 py-3">
      <span class="block text-xs font-black uppercase tracking-wide text-gray-400">
        Último folio
      </span>

      <!-- <span class="mt-1 block text-sm font-black font-ubuntu-mono text-[#C1121F]"> -->
              <span class="mt-1 block text-sm font-black font-noto-sans text-[#C1121F]">

        {{ folio.ultimo_folio || 'Sin folios' }}
      </span>
    </div>
  </article>
</div>
