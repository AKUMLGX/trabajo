<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  @for (folio of folios; track folio) {
    <article class="tl-card tl-stat-clickable flex flex-col p-5">
      <div class="mb-4 flex items-start justify-between gap-4">
        <span class="tl-section-icon"><span class="icon-font !text-[22px]">{{ folio.icono || 'confirmation_number' }}</span></span>
        <span class="tl-chip tl-chip-primary">{{ folio.acronimo }}</span>
      </div>
      <h3 class="m-0 line-clamp-2 font-noto-sans text-sm font-semibold text-tlalcalli-deep">{{ folio.titulo }}</h3>
      @if (folio.descripcion) {
        <p class="m-0 mt-1 line-clamp-2 font-noto-sans text-xs text-tlalcalli-gray">{{ folio.descripcion }}</p>
      }
      <div class="mt-auto pt-5">
        <span class="tl-stat-label">Total generado</span>
        <span class="tl-stat-value mt-1 block text-tlalcalli-primary">{{ folio.total }}</span>
      </div>
      <div class="mt-4 rounded-xl bg-tlalcalli-light-lavender px-4 py-2.5">
        <span class="tl-stat-label">Último folio</span>
        <span class="mt-0.5 block font-mono text-sm font-semibold text-tlalcalli-primary">{{ folio.ultimo_folio || 'Sin folios' }}</span>
      </div>
    </article>
  }
</div>
