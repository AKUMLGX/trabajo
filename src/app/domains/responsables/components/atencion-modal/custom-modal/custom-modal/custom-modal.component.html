@if (visible) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/45">
    <div class="w-[460px] max-w-[90vw] overflow-hidden rounded-[9px] bg-[#F7F3F1] shadow-2xl">

      <div class="h-[58px] bg-[#4B006E]"></div>

      <div class="px-10 py-10">
        @if (type === 'confirm') {
          <p class="text-center text-[16px] font-noto-sans text-[#4B006E]">
            {{ title }}
          </p>
        }

        @if (type === 'input') {
          <input
            [(ngModel)]="valor"
            type="text"
            class="h-[54px] w-full rounded-[8px] border border-[#4B006E] bg-white px-4 text-center text-[15px] font-semibold text-[#4B006E] outline-none placeholder:text-[#A783BC]"
            [placeholder]="inputPlaceholder"
            autocomplete="off"
          />
        }

        <div class="mt-10 flex justify-center gap-5">
          <button
            type="button"
            (click)="onCancel()"
            class="h-[43px] min-w-[94px] rounded-[7px] border border-[#4B006E] bg-white px-5 text-[14px] font-noto-sans text-[#4B006E]">
            {{ cancelText }}
          </button>

          <button
            type="button"
            (click)="onConfirm()"
            class="h-[43px] min-w-[94px] rounded-[7px] bg-[#4B006E] px-5 text-[14px] font-noto-sans text-[#D9B536]">
            {{ confirmText }}
          </button>
        </div>
      </div>

    </div>
  </div>
}
