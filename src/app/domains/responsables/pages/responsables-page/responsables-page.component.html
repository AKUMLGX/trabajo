<!-- =============================================
     MI BANDEJA DE EXPEDIENTES - VISTA PRINCIPAL
     ============================================= -->
<div class="page-container">
  
  <!-- HEADER HERO -->
  <header class="hero-header">
    <!-- Patrón de fondo -->
    <div class="hero-pattern">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgba(255,255,255,0.03)" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"/>
      </svg>
    </div>
    
    <!-- Círculos decorativos -->
    <div class="hero-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
    
    <!-- Contenido del header -->
    <div class="hero-content">
      <div class="hero-main">
        <!-- Icono y título -->
        <div class="hero-title-group">
          <div class="hero-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
              <path d="M9 12h6M9 16h6"/>
            </svg>
          </div>
          <div class="hero-text">
            <h1>Mi Bandeja de Expedientes</h1>
            <p>Gestiona y da seguimiento a los asuntos asignados</p>
          </div>
        </div>
        
        <!-- Widget de fecha -->
        <div class="date-widget">
          <div class="date-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
          </div>
          <div class="date-info">
            <span class="date-label">Hoy</span>
            <span class="date-value">{{ fechaActual }}</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <app-responsables-table></app-responsables-table>
  </main>
  
</div>
