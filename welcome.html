<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat'
        }

        .principal {
            overflow: hidden;
            position: relative;
            /* padding: 3rem;  */
            width: 100vw;
            height: 100vh;
            text-align: center;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .contenedor {
            overflow: hidden;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-attachment: fixed;

        }

        .contenedor-1 {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .color {
            color: #006666;
        }

        .contenedor-centro {
            display: block ;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
            border-width: 1px;
            max-width: 24rem;
            max-height: 33rem;
            height: auto;
            /* height: 623px; */
            width: 434px;
            border-radius: 0.5rem;
            border-color: #E5E7EB;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            background-color: rgb(255 255 255 / 0.2)
        }

        .contendor-img {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img1 {
            height: 5rem;
            margin-bottom: 2.5rem;
        }

        .text-1 {
            margin-bottom: 1.5rem;
            margin-top: 0rem;
            font-size: 2.5rem;
            line-height: 2.5rem;
            font-weight: 600;
        }

        .text-2 {
            font-size: 1.25rem;
            line-height: 1.75rem;
            font-weight: 600;
        }

        .contendor-btn {
            margin-top: 5rem;
            text-align: center;
        }

        .btn-iniciar {
            padding-left: 1.75rem;
            padding-right: 1.75rem;
            background-color: #691C32;
            margin-top: 0.5rem;
            border-radius: 0.5rem;
            border-width: 1px;
            font-size: 1.125rem;
            line-height: 1.75rem;
            font-weight: 500;
            line-height: 1.5;
            color: #ffffff;
            text-transform: uppercase;
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
            transition-duration: 150ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 8px;
            padding-top: 10px;
            font-family: 'Montserrat'
        }

        .btn-iniciar:hover {
            color: #1E3A8A;
            background-color: #ffffff;
        }
    </style>
    <title>Akamba</title>
</head>

<body>
    <div class="principal" style="background-image: url('/home/akamba/akamba-login-2.jpg');">
        <div class="contenedor" style="background-color: rgba(0, 0, 0, 0.2)">
            <div class="contenedor-1">
                <div class="color">
                    <div class="contenedor-centro">
                        <div class="contendor-img">
                            <div class="img1">
                                <img src="./imagotipos_hacienda_sat_color.png" style="width: 100%; height:auto;"  alt="hacienda_sat">
                            </div>
                        </div>
                        <div class="contendor-img">
                            <div>
                                <img src="./AKAMBA_ICONO_FAVICONO.svg" style="width: 100%; height: auto;" alt="AKAMBA_ICONO">
                            </div>
                        </div>
                        <h2 class="text-1">akamba</h2>
                        <h4 class="text-2">Un proyecto para ACAPE Contenido</h4>
                        <div class="contendor-btn">
                            <a href="https://auth.dev.cloudb.sat.gob.mx/nidp/oauth/nam/authz?response_type=code&resourceServer=AKAMBA&state=oE4l6flQqKv3ulNvyRXmjaOkZiicW8qV&client_id=406b330f-ba1b-4f9b-9b5b-97aa719859ee&redirect_uri=https://pe.dev.cloudb.sat.gob.mx/akamba/layout&scope=AKAMBA">
                                <button type="button" class="btn-iniciar">
                                    Iniciar sesión
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
