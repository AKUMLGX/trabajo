version: '3'
services:
  akamba:
    image: nexusavl.sat.gob.mx:8093/akamba/${SERVICE_NAME}:${VERSION}
    environment:
      - hash=${HASH}
      - environment=${ENVIRONMENT}
      - baseUrl=${BASEURL}
      - layoutUrl=${LAYOUTURL}
      - loginUrl=${LOGINURL}
      - logoutUrl=${LOGOUTURL}
    user: root
    ports:
      - 80:80
    restart: always
