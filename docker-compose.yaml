version: '3'
services:
  akamba:
    image: nexusavl.sat.gob.mx:8093/akamba/${SERVICE_NAME}:${VERSION}
    environment:
      - hash=${HASH}
      - environment=${ENV_ENVIRONMENT}
      - baseUrl=${ENV_BASEURL}
      - layoutUrl=${ENV_LAYOUTURL}
      - loginUrl=${ENV_LOGINURL}
      - logoutUrl=${ENV_LOGOUTURL}
    user: root
    ports:
      - 80:80
    restart: always
