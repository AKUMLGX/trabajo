# Despliegue a PRODUCCION
Deploy_PROD:
  variables:
   HASH:  ${CI_COMMIT_SHA}
   VERSION: ${VERSION}-R
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_BRANCH =~ /produccion*/
      when: manual
  image: docker:24.0.7
  services:
    - docker:dind
  stage: Deploy_PROD
  dependencies: []
  tags:
    - Develop
  before_script:
    - docker context create deploy-A --docker "host=tcp://${AKAMBA_FRONT_A}:2375"
    - docker context create deploy-B --docker "host=tcp://${AKAMBA_FRONT_B}:2375"
    - unset DOCKER_HOST
    - echo $DOCKER_AUTH_CONFIG > $HOME/.docker/config.json
  script:
    - echo "Deploying in ${AKAMBA_FRONT_A}"
    - docker-compose --context deploy-A -f docker-compose.yaml down
    - docker --context deploy-A system prune -af
    - docker --context deploy-A ps
    - docker-compose --context deploy-A -f docker-compose.yaml pull
    - docker-compose --context deploy-A -f docker-compose.yaml up -d
    - docker-compose --context deploy-A -f docker-compose.yaml ps
    - echo "Deploying in ${AKAMBA_FRONT_B}"
    - docker-compose --context deploy-B -f docker-compose.yaml down
    - docker --context deploy-B system prune -af
    - docker --context deploy-B ps
    - docker-compose --context deploy-B -f docker-compose.yaml pull
    - docker-compose --context deploy-B -f docker-compose.yaml up -d
    - docker-compose --context deploy-B -f docker-compose.yaml ps
  after_script:
    - docker logout
  environment:
    name: production
