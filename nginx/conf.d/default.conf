# =============================================================================
# Configuración Nginx para Tlalcalli Frontend
# Optimizado para contenedor Docker con proxy al backend
# =============================================================================

# Upstream para el backend (nombre del servicio en Docker Compose)
upstream backend_api {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Raíz de archivos estáticos
    root /var/www/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/atom+xml image/svg+xml;
    gzip_comp_level 6;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------
    # Proxy al Backend API
    # ---------------------------------------------------------------------------
    location /akamba/api/v1 {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    location /tlalcalli/api/v1 {
        rewrite ^/tlalcalli/api/v1(.*)$ /akamba/api/v1$1 break;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Endpoint para PDFs
    location /getPdf {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout más largo para generación de PDFs
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # Archivos estáticos
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Assets
    location /assets {
        alias /var/www/html/assets/;
        try_files $uri =404;
    }

    location /home/akamba/assets {
        alias /var/www/html/assets/;
        try_files $uri /index.html =404;
    }

    # ---------------------------------------------------------------------------
    # Página de bienvenida/login
    # ---------------------------------------------------------------------------
    location /home/akamba/login {
        try_files $uri $uri/ /welcome.html;
    }

    # Redirección de /akamba a /akamba/
    location /akamba {
        return 302 /akamba/;
    }

    location /akamba/ {
        alias /var/www/html/akamba/;
        try_files $uri $uri/ /akamba/index.html;
    }

    # ---------------------------------------------------------------------------
    # Raíz: redirigir a la app en /akamba/
    # ---------------------------------------------------------------------------
    location = / {
        return 302 /akamba/;
    }

    # ---------------------------------------------------------------------------
    # SPA - Angular routing (fallback para otras rutas en raíz)
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Error pages
    # ---------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
